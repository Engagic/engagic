# Real client IP resolution + rate limit zones, shared by every site on this box.
# Static on purpose: cloudflare-ips.conf is regenerated weekly and only holds
# the $is_cloudflare geo block. Repo copy: /opt/engagic/deploy/nginx/client-ip.conf
#
# Fallback chain (first non-empty wins):
#   X-Forwarded-Client-IP -- the visitor IP our SSR Workers copy from
#     cf-connecting-ip. Trusted ONLY when CF-Worker names one of our zones.
#     Cloudflare sets CF-Worker on Worker subrequests and strips any
#     client-supplied copy (verified 2026-10-07: a direct request with a forged
#     CF-Worker logged cfw="-"). Before this, any client could set
#     X-Forwarded-Client-IP through Cloudflare and pick its own rate-limit and
#     ban key.
#   CF-Connecting-IP -- set by Cloudflare for direct-proxy traffic.
#   $remote_addr -- final fallback.

map $http_cf_worker $worker_client_ip {
    default           "";
    "engagic.org"     $http_x_forwarded_client_ip;
    "motioncount.com" $http_x_forwarded_client_ip;
    "spygov.com"      $http_x_forwarded_client_ip;
}

map $http_cf_connecting_ip $cf_client_ip {
    ""      "";
    default $http_cf_connecting_ip;
}

map $worker_client_ip $resolved_ip_stage1 {
    ""      $cf_client_ip;
    default $worker_client_ip;
}

map $resolved_ip_stage1 $resolved_ip_stage2 {
    ""      $remote_addr;
    default $resolved_ip_stage1;
}

map $is_cloudflare $real_client_ip {
    1       $resolved_ip_stage2;
    default $remote_addr;
}

# Tiered rate limiting -- multiple zones stack (request must pass ALL)
# Burst: absorbs page-load spikes (single page triggers 3-5 API calls)
limit_req_zone $real_client_ip zone=api_burst:10m rate=10r/s;
# Sustained: caps per-minute throughput to prevent crawling
limit_req_zone $real_client_ip zone=api_sustained:10m rate=2r/s;
# Matters: stricter limit on high-value content endpoints
limit_req_zone $real_client_ip zone=api_matters:10m rate=1r/s;
